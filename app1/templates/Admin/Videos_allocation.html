   {% extends 'Admin/Admin_base.html' %}
   {% block body %}

        <div class='col-6 offset-3'>
        <form method='post' enctype='multipart/form-data'>
            {% csrf_token %}
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Topic Name</label>
                 <select name='course' class="form-select form-select-sm" aria-label=".form-select-sm example">
            <option selected>Select Your Course</option>
            {% for x in all_course %}
            <option value="{{x.id}}">{{x.Course_name}}</option>
            {% endfor %}
            </select>

            </div>
             <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Title</label>
                <input name='title' type="text" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
                
            </div>
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Profile</label>
                <input name='video' type="file" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
                
            </div>
           

           
            <button type="submit" class="btn btn-primary">Submit</button>
            </form>
        </div>

    {% endblock %}
