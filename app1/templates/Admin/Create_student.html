{% extends 'Admin/Admin_base.html' %}
   {% block body %}

        <div class='col-6 offset-3'>
        <form method='post' enctype='multipart/form-data'>
            {% csrf_token %}
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Name</label>
                <input type="text" name='Name' class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
                
            </div>
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Profile</label>
                <input type="file" name='profile' class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
                
            </div>
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Email</label>
                <input type="email" name='Email' class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
            </div>
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Mobile</label>
                <input type="tel" name='Mobile' class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
                
            </div>
            <div class="mb-3">
                <label for="exampleInputEmail1" class="form-label">Course Validity</label>
                <input type="date" name='Validity_date' class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp">
                
            </div>

           
            <button type="submit" class="btn btn-primary">Submit</button>
            </form>
        </div>



        
  {% endblock %}
