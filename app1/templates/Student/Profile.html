{% extends 'Student/Base.html' %}
       

{% block body %}

        <div class='container mt-4'>
        <div class='row'>
                <div class='col-6'>
                        <div style="width:50%; height:300px; overflow:hidden;" class='bg-secondary  border border-1 rounded rounded-circle'>
                                <img width='100%' height="100%" src="{{data.Student_profile.url}}" />
                        </div>
                </div>
                <div class='col-6'>
                        <form>
                             <div class="mb-3">
                        <label for="exampleInputEmail1" class="form-label">Enrollment Id</label>
                        <input type="text" class="form-control" readonly value="{{data.Student_id}}" id="exampleInputEmail1" aria-describedby="emailHelp">
                      
                    </div>
                     <div class="mb-3">
                        <label for="exampleInputEmail1" class="form-label">Name</label>
                        <input type="email" class="form-control" readonly value="{{data.Student_Name}}" id="exampleInputEmail1" aria-describedby="emailHelp">
                    </div>
                     <div class="mb-3">
                        <label for="exampleInputEmail1" class="form-label">Course Enrollment Date</label>
                        <input type="text" class="form-control" readonly value="{{data.Enrollment_date}}" id="exampleInputEmail1" aria-describedby="emailHelp">
                      
                    </div>
                     <div class="mb-3">
                        <label for="exampleInputEmail1" class="form-label">Course Validity</label>
                        <input type="text" class="form-control" readonly value="{{data.Course_validity}}" id="exampleInputEmail1" aria-describedby="emailHelp">
                    </div>
                    <div class="mb-3">
                        <label for="exampleInputEmail1" class="form-label">Mobile</label>
                        <input type="text" class="form-control" readonly value="{{data.Student_Mobile}}" id="exampleInputEmail1" aria-describedby="emailHelp">
                    </div>
                    <div class="mb-3">
                        <label for="exampleInputEmail1" class="form-label">Email address</label>
                        <input type="text" class="form-control" readonly value="{{data.Student_Email}}" id="exampleInputEmail1" aria-describedby="emailHelp">
                    </div>
                    <div class="mb-3">
                        <label for="exampleInputPassword1" class="form-label">Password</label>
                        <input type="password" class="form-control" readonly value="{{data.password}}" id="exampleInputPassword1">
                    </div>
                  
                 
                    </form>
                </div>
        </div>
    </div>


    {% endblock %}
